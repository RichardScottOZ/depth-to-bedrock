[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-to-bedrock"
version = "0.1.0"
description = "Python implementation for depth to bedrock prediction using machine learning"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Depth to Bedrock Contributors"}
]
keywords = ["geology", "machine-learning", "spatial-analysis", "geoscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "geopandas>=0.10.0",
    "rasterio>=1.2.0",
    "shapely>=1.8.0",
    "pyproj>=3.2.0",
    "fiona>=1.8.0",
    "scikit-learn>=1.0.0",
    "xgboost>=1.5.0",
    "pysal>=2.5.0",
    "joblib>=1.1.0",
    "pyarrow>=6.0.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
all = [
    "depth-to-bedrock[viz,dev]",
]

[project.urls]
Homepage = "https://github.com/RichardScottOZ/depth-to-bedrock"
Repository = "https://github.com/RichardScottOZ/depth-to-bedrock"

[tool.setuptools]
packages = ["functions"]
package-dir = {"" = "."}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
